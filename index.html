<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北美中国书局出版社 | North America China Book Bureau Press</title>

  <style>
    :root {
      --red: #9b1c31;
      --red-dark: #4b1720;
      --red-light: #fff1f0;
      --ink: #312326;
      --muted: #706164;
      --line: #eadfe0;
      --paper: #fff;
      --background: #fbf8f7;
      --gold: #b88a39;
      --shadow: 0 8px 28px rgba(90, 23, 34, 0.1);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .wrap {
      width: min(1240px, calc(100% - 36px));
      margin: 0 auto;
    }

    .topbar {
      background: var(--red-dark);
      color: #fff;
      font-size: 13px;
    }

    .topbar-inner,
    .header-inner,
    .nav-inner,
    .section-heading,
    .submission-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-inner { min-height: 36px; }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .language-button {
      padding: 3px 9px;
      color: #fff;
      background: transparent;
      border: 1px solid #ffffff70;
      border-radius: 4px;
      font-size: 12px;
    }

    .header {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      min-height: 92px;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      flex: 1;
      min-width: 220px;
    }

    .brand-logo {
      width: 50px;
      height: 50px;
      flex: none;
    }

    .brand-name {
      font-family: Georgia, "Noto Serif SC", serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.15;
    }

    .brand-name small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 0.06em;
      font-weight: 400;
    }

    .search {
      position: relative;
      display: flex;
      flex: 1.4;
      max-width: 560px;
    }

    .search input {
      width: 100%;
      height: 45px;
      padding: 0 52px 0 15px;
      border: 1px solid #d7c9cb;
      border-radius: 5px;
      outline: none;
    }

    .search input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px #9b1c311c;
    }

    .search button {
      position: absolute;
      top: 0;
      right: 0;
      width: 48px;
      height: 45px;
      color: #fff;
      background: var(--red);
      border: 0;
      border-radius: 0 5px 5px 0;
      font-size: 20px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 17px;
      white-space: nowrap;
    }

    .header-actions button {
      padding: 6px 0;
      color: var(--ink);
      background: transparent;
      border: 0;
      font-size: 14px;
    }

    .header-actions button:hover,
    .nav-link:hover,
    .see-all:hover {
      color: var(--red);
    }

    .cart-count {
      display: inline-block;
      margin-left: 4px;
      padding: 0 6px;
      color: #fff;
      background: var(--red);
      border-radius: 20px;
      font-size: 11px;
    }

    nav {
      position: relative;
      z-index: 5;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      min-height: 49px;
      justify-content: flex-start;
      gap: 30px;
    }

    .nav-item {
      position: relative;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 13px 0;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: -12px;
      display: none;
      width: 245px;
      padding: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 7px;
      box-shadow: var(--shadow);
    }

    .nav-item:hover .dropdown,
    .nav-item:focus-within .dropdown,
    .nav-item.open .dropdown {
      display: grid;
    }

    .dropdown button {
      padding: 10px 11px;
      text-align: left;
      background: #fff;
      border: 0;
      border-radius: 4px;
      color: var(--ink);
    }

    .dropdown button:hover {
      color: var(--red);
      background: var(--red-light);
    }

    .nav-spacer { flex: 1; }

    .nav-note {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .mobile-menu { display: none; }

    .mission {
      padding: 28px 0 15px;
    }

    .mission-grid {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: 0 4px 20px rgba(90, 23, 34, 0.06);
    }

    .mission-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 38px;
    }

    .eyebrow {
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .mission h1 {
      max-width: 450px;
      margin: 12px 0;
      font: 700 clamp(30px, 3.5vw, 44px)/1.2 Georgia, "Noto Serif SC", serif;
    }

    .mission p {
      max-width: 470px;
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 16px;
    }

    .primary-button,
    .buy-button {
      display: inline-block;
      align-self: flex-start;
      padding: 11px 17px;
      color: #fff;
      background: var(--red);
      border: 0;
      border-radius: 5px;
      font-weight: 700;
    }

    .primary-button:hover,
    .buy-button:hover,
    .search button:hover {
      background: #741525;
    }

    .rotator {
      position: relative;
      min-height: 340px;
      overflow: hidden;
      background: var(--red-dark);
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      background-position: center;
      background-size: cover;
      transition: opacity 0.7s ease;
    }

    .slide::after {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(0deg, #260b10c7, #260b1008 70%);
    }

    .slide.active { opacity: 1; }

    .slide-copy {
      position: relative;
      z-index: 1;
      padding: 25px 32px;
      color: #fff;
    }

    .slide-copy strong {
      display: block;
      font: 700 24px Georgia, "Noto Serif SC", serif;
    }

    .slide-copy span { font-size: 14px; }

    .slider-button {
      position: absolute;
      z-index: 2;
      top: 50%;
      width: 38px;
      height: 38px;
      color: #fff;
      background: #4b172077;
      border: 1px solid #ffffff70;
      border-radius: 50%;
      transform: translateY(-50%);
    }

    .slider-prev { left: 15px; }
    .slider-next { right: 15px; }

    .dots {
      position: absolute;
      z-index: 2;
      right: 22px;
      bottom: 28px;
      display: flex;
      gap: 8px;
    }

    .dots button {
      width: 9px;
      height: 9px;
      padding: 0;
      background: transparent;
      border: 1px solid #fff;
      border-radius: 50%;
    }

    .dots button.active { background: #fff; }

    .book-section { padding: 25px 0 5px; }
    .book-section.tint { background: var(--red-light); }

    .section-heading {
      align-items: flex-end;
      gap: 18px;
      margin-bottom: 13px;
    }

    .section-heading h2 {
      margin: 0;
      font: 700 24px Georgia, "Noto Serif SC", serif;
    }

    .section-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .see-all {
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .shelf {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: calc((100% - 80px) / 5);
      gap: 16px;
      overflow-x: auto;
      padding: 4px 2px 17px;
      scroll-snap-type: x mandatory;
      scrollbar-color: #d7bfc2 transparent;
      scrollbar-width: thin;
    }

    .book-card {
      min-width: 0;
      padding: 11px;
      cursor: pointer;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 7px;
      scroll-snap-align: start;
      transition: transform 0.18s, box-shadow 0.18s;
    }

    .book-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .book-cover {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      overflow: hidden;
      padding: 14px;
      color: #fff;
      text-align: center;
      background: var(--cover);
      box-shadow: inset 0 0 0 5px #ffffff20, 2px 4px 9px #192a3b2b;
    }

    .book-cover::before {
      position: absolute;
      inset: 10px;
      content: "";
      border: 1px solid #ffffff70;
    }

    .cover-copy { position: relative; z-index: 1; }

    .cover-category {
      margin-bottom: 12px;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .cover-title {
      font: 700 21px/1.25 Georgia, "Noto Serif SC", serif;
    }

    .cover-author {
      margin-top: 14px;
      font-size: 10px;
    }

    .book-card h3 {
      display: -webkit-box;
      overflow: hidden;
      margin: 10px 0 4px;
      font-size: 14px;
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .book-author,
    .book-format {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .book-format { margin-top: 4px; font-size: 11px; }

    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding: 5px 0 24px;
    }

    .category-pills button {
      padding: 8px 14px;
      color: #673139;
      background: #fff;
      border: 1px solid #e4cdd0;
      border-radius: 30px;
    }

    .category-pills button:hover {
      color: #fff;
      background: var(--red);
      border-color: var(--red);
    }

    .submission {
      margin: 30px auto 24px;
      padding: 27px 32px;
      color: #fff;
      background: var(--red-dark);
      border-radius: 9px;
    }

    .submission h2 {
      margin: 0 0 5px;
      font: 700 23px Georgia, "Noto Serif SC", serif;
    }

    .submission p {
      margin: 0;
      color: #f3dddf;
      font-size: 14px;
    }

    .submission-inner { gap: 20px; }

    .submission a {
      padding: 10px 15px;
      color: var(--red-dark);
      background: #fff;
      border-radius: 5px;
      font-weight: 700;
      white-space: nowrap;
    }

    footer {
      margin-top: 38px;
      padding: 34px 0 22px;
      color: #f1dfe1;
      background: #32131b;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 30px;
    }

    footer h3 {
      margin: 0 0 10px;
      color: #fff;
      font: 700 16px Georgia, "Noto Serif SC", serif;
    }

    footer p,
    footer a {
      color: #ddc9cc;
      font-size: 13px;
    }

    footer p { max-width: 400px; }

    .footer-links {
      display: grid;
      gap: 7px;
    }

    .copyright {
      margin-top: 22px;
      padding-top: 14px;
      color: #cbb8bb;
      border-top: 1px solid #ffffff28;
      font-size: 12px;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #19090ccc;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      position: relative;
      width: min(540px, 100%);
      padding: 25px;
      background: #fff;
      border-radius: 9px;
      box-shadow: var(--shadow);
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 14px;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-size: 25px;
    }

    .modal h2 {
      margin: 0 35px 5px 0;
      font: 700 24px Georgia, "Noto Serif SC", serif;
    }

    .modal-author { color: var(--muted); font-size: 13px; }
    .modal p { color: #57484b; }

    .toast {
      position: fixed;
      z-index: 30;
      bottom: 20px;
      left: 50%;
      padding: 11px 16px;
      color: #fff;
      background: var(--red-dark);
      border-radius: 5px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 15px);
      transition: 0.2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 950px) {
      .header-inner { flex-wrap: wrap; padding: 13px 0; }
      .brand { min-width: 0; }
      .header-actions { margin-left: auto; }
      .search { order: 3; flex-basis: 100%; max-width: none; }
      .shelf { grid-auto-columns: calc((100% - 48px) / 4); }
      .nav-inner { gap: 20px; }
      .nav-note { display: none; }
    }

    @media (max-width: 650px) {
      .wrap { width: calc(100% - 28px); }
      .topbar { font-size: 11px; }
      .header-inner { gap: 10px; }
      .brand-logo { width: 42px; height: 42px; }
      .brand-name { font-size: 14px; }
      .brand-name small { font-size: 8px; }
      .header-actions { gap: 10px; }
      .header-actions button { font-size: 12px; }
      .mobile-menu {
        display: block;
        padding: 8px 10px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .nav-inner { min-height: 47px; justify-content: space-between; }
      .nav-links {
        position: absolute;
        top: 100%;
        right: 0;
        left: 0;
        display: none;
        padding: 8px 18px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      nav.mobile-open .nav-links { display: grid; }
      .nav-item { border-bottom: 1px solid #f0e8e9; }
      .nav-link { padding: 11px 0; }
      .dropdown {
        position: static;
        width: 100%;
        border: 0;
        border-top: 1px solid var(--line);
        border-radius: 0;
        box-shadow: none;
      }
      .mission { padding-top: 17px; }
      .mission-grid { grid-template-columns: 1fr; }
      .mission-copy { padding: 25px 22px; }
      .mission h1 { font-size: 32px; }
      .rotator { min-height: 250px; }
      .slide-copy { padding: 20px 25px; }
      .slide-copy strong { font-size: 20px; }
      .section-heading h2 { font-size: 21px; }
      .shelf { grid-auto-columns: calc((100% - 24px) / 2.2); gap: 12px; }
      .book-cover { height: 175px; }
      .cover-title { font-size: 18px; }
      .submission-inner { align-items: flex-start; flex-direction: column; }
      .footer-grid { grid-template-columns: 1fr; gap: 18px; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap topbar-inner">
      <span data-zh="北美中国书局出版社 · 让好书连接文化与读者"
            data-en="North America China Book Bureau Press · Connecting readers through books"></span>
      <div class="topbar-actions">
        <a href="#about" data-zh="联系我们" data-en="Contact us"></a>
        <button class="language-button" id="languageButton" type="button">English</button>
      </div>
    </div>
  </div>

  <header class="header">
    <div class="wrap header-inner">
      <a class="brand" href="#top" aria-label="北美中国书局出版社">
        <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="#fff9f8" stroke="#eadfe0" stroke-width="2"/>
          <path d="M13 19c7-3 14-2 19 2 5-4 12-5 19-2v26c-7-3-14-2-19 2-5-4-12-5-19-2V19Z" fill="#9b1c31"/>
          <path d="M32 21v25M18 25c4-1 7-1 10 1M18 31c4-1 7-1 10 1M36 26c3-2 6-2 10-1M36 32c3-2 6-2 10-1" fill="none" stroke="#fff" stroke-width="1.6"/>
          <path d="m32 7 2 5 5 .5-4 3 1.4 5-4.4-2.7-4.4 2.7 1.4-5-4-3 5-.5Z" fill="#b88a39"/>
        </svg>
        <span class="brand-name" id="brandName">
          北美中国书局出版社
          <small>NORTH AMERICA CHINA BOOK BUREAU PRESS</small>
        </span>
      </a>

      <form class="search" id="searchForm">
        <input id="searchInput" type="search"
               placeholder="搜索你想找的书……"
               aria-label="搜索图书">
        <button type="submit" aria-label="搜索">⌕</button>
      </form>

      <div class="header-actions">
        <button type="button" data-toast-zh="登录入口可在后续连接读者账户"
                data-toast-en="Reader sign-in can be connected later">
          ♙ <span data-zh="登录" data-en="Log in"></span>
        </button>
        <button type="button" data-toast-zh="购物车可在后续连接购书平台"
                data-toast-en="The cart can be connected to a bookstore later">
          🛒 <span data-zh="购物车" data-en="Cart"></span>
          <span class="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <nav id="navigation">
    <div class="wrap nav-inner">
      <button class="mobile-menu" id="mobileMenu" type="button"
              aria-expanded="false" data-zh="☰ 菜单" data-en="☰ Menu"></button>

      <div class="nav-links">
        <div class="nav-item" id="browseItem">
          <a class="nav-link" id="browseToggle" href="#categories">
            <span data-zh="按类别浏览我们的图书"
                  data-en="Browse books by category"></span>
            <span aria-hidden="true">▾</span>
          </a>
          <div class="dropdown" id="categoryDropdown"></div>
        </div>

        <div class="nav-item">
          <a class="nav-link" href="#new-books" data-zh="新书" data-en="New Books"></a>
        </div>
        <div class="nav-item">
          <a class="nav-link" href="#submissions" data-zh="投稿" data-en="Submissions"></a>
        </div>
        <div class="nav-item">
          <a class="nav-link" href="#catalog" data-zh="目录" data-en="Catalog"></a>
        </div>
        <div class="nav-item">
          <a class="nav-link" href="#about" data-zh="关于我们" data-en="About Us"></a>
        </div>
      </div>

      <span class="nav-spacer"></span>
      <span class="nav-note"
            data-zh="中文与英文出版 · 文学、文化、教育与生活"
            data-en="Books in English and Chinese · Literature, culture, education & life"></span>
    </div>
  </nav>

  <main id="top">
    <section class="mission">
      <div class="wrap mission-grid">
        <div class="mission-copy">
          <span class="eyebrow">North America China Book Bureau Press</span>
          <h1 data-zh="好书，连接文化与世界。"
              data-en="Books connect cultures and the world."></h1>
          <p data-zh="我们呈现多元的故事、文化与知识，让不同背景的读者都能在书页之间发现新的视角。"
             data-en="We share diverse stories, cultures, and ideas, helping readers discover new perspectives between the pages."></p>
          <a class="primary-button" href="#new-books"
             data-zh="浏览新书" data-en="Browse new books"></a>
        </div>

        <div class="rotator" id="rotator">
          <div class="slide active"
               style="background-image:url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1400&q=85')">
            <div class="slide-copy">
              <strong data-zh="在阅读中遇见更广阔的世界"
                      data-en="Discover a wider world through reading"></strong>
              <span data-zh="精选新书、文化作品与多元声音"
                    data-en="New releases, cultural works, and diverse voices"></span>
            </div>
          </div>
          <div class="slide"
               style="background-image:url('https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=1400&q=85')">
            <div class="slide-copy">
              <strong data-zh="每一本书，都是一次新的出发"
                      data-en="Every book begins a new journey"></strong>
              <span data-zh="探索故事、历史、艺术与生活"
                    data-en="Explore stories, history, art, and everyday life"></span>
            </div>
          </div>
          <div class="slide"
               style="background-image:url('https://images.unsplash.com/photo-1495446815901-a7297e633e8d?auto=format&fit=crop&w=1400&q=85')">
            <div class="slide-copy">
              <strong data-zh="把值得珍藏的文字带给读者"
                      data-en="Bringing lasting words to readers"></strong>
              <span data-zh="来自北美中国书局出版社"
                    data-en="From North America China Book Bureau Press"></span>
            </div>
          </div>

          <button class="slider-button slider-prev" id="previousSlide"
                  type="button" aria-label="上一张">‹</button>
          <button class="slider-button slider-next" id="nextSlide"
                  type="button" aria-label="下一张">›</button>
          <div class="dots" id="slideDots"></div>
        </div>

    <div id="shelves"></div>

    <section class="book-section" id="categories">

            <h2 data-zh="按类别浏览" data-en="Browse by Category"></h2>

  <div class="modal-backdrop" id="bookModal">
    <article class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="closeModal" type="button" aria-label="关闭">×</button>

      <a class="buy-button" id="purchaseLink" href="#" target="_blank" rel="noopener"
         data-zh="查看购书链接" data-en="Purchase options"></a>

  <div class="toast" id="toast" role="status"></div>

  <script>
    let language = "zh";

    const books = [
      {
        titleZh: "走进西藏",
        titleEn: "A Journey Through Tibet",
        authorZh: "格桑丹布",
        authorEn: "Gesang Dambu",
        category: "travel",
        categoryZh: "文化与旅行",
        categoryEn: "Culture & Travel",
        descriptionZh: "带领读者走近西藏地理、历史、风俗与人文风景的文化旅游作品。",
        descriptionEn: "A cultural travel guide to Tibet’s geography, history, customs, and people.",
        formatZh: "纸书 / 电子书",
        formatEn: "Print / eBook",
        cover: "linear-gradient(145deg,#762b33,#d3a05b)",
        groups: ["new", "featured", "ebook"]
      },
      {
        titleZh: "杨式太极·杨露禅",
        titleEn: "Yang-Style Tai Chi: Yang Luchan",
        authorZh: "王湘霞",
        authorEn: "Wang Xiangxia",
        category: "martial-arts",
        categoryZh: "武术与传统文化",
        categoryEn: "Martial Arts & Tradition",
        descriptionZh: "介绍杨式太极的历史源流、练习文化与传统武术传承。",
        descriptionEn: "An introduction to the history, practice, and cultural heritage of Yang-style Tai Chi.",
        formatZh: "纸书",
        formatEn: "Print",
        cover: "linear-gradient(145deg,#8c322d,#d39b52)",
        groups: ["new", "featured"]
      },
      {
        titleZh: "生日",
        titleEn: "Birthday",
        authorZh: "薄海波",
        authorEn: "Bo Haibo",
        category: "fiction",
        categoryZh: "小说",
        categoryEn: "Fiction",
        descriptionZh: "一部围绕生日、家庭记忆与人生关系展开的小说。",
        descriptionEn: "A novel about birthdays, family memories, and the relationships that shape a life.",
        formatZh: "纸书 / 电子书",
        formatEn: "Print / eBook",
        cover: "linear-gradient(145deg,#6d243d,#e1a94e)",
        groups: ["new", "fiction", "ebook"]
      },
      {
        titleZh: "三河县的老妈子",
        titleEn: "The Matron of Sanhe County",
        authorZh: "韩京",
        authorEn: "Han Jing",
        category: "fiction",
        categoryZh: "小说",
        categoryEn: "Fiction",
        descriptionZh: "以大四合院生活为背景，描绘人物命运与家庭日常的长篇故事。",
        descriptionEn: "A family story set around life in a traditional courtyard home.",
        formatZh: "纸书",
        formatEn: "Print",
        cover: "linear-gradient(145deg,#4b302d,#bd7651)",
        groups: ["new", "fiction"]
      },
      {
        titleZh: "西方歌剧发展史",
        titleEn: "A History of Western Opera",
        authorZh: "施鸿鄂、刘维维、韩京",
        authorEn: "Shi Hong’e, Liu Weiwei & Han Jing",
        category: "history",
        categoryZh: "艺术与历史",
        categoryEn: "Art & History",
        descriptionZh: "梳理西方歌剧的发展脉络与重要作品，供读者了解歌剧历史。",
        descriptionEn: "An introduction to the development of Western opera and its landmark works.",
        formatZh: "精装 / 电子书",
        formatEn: "Hardcover / eBook",
        cover: "linear-gradient(145deg,#5b1e2b,#b88a39)",
        groups: ["featured", "ebook"]
      },
      {
        titleZh: "一个人的世界",
        titleEn: "One Person’s World",
        authorZh: "张春宏",
        authorEn: "Zhang Chunhong",
        category: "fiction",
        categoryZh: "小说",
        categoryEn: "Fiction",
        descriptionZh: "一部关注个体生活、内心感受与人生选择的小说。",
        descriptionEn: "A novel about individual lives, inner experience, and the choices people make.",
        formatZh: "纸书",
        formatEn: "Print",
        cover: "linear-gradient(145deg,#6a3c3f,#c79c7b)",
        groups: ["featured", "fiction"]
      },
      {
        titleZh: "怎样建立一个幸福的家庭？",
        titleEn: "How to Build a Happy Family",
        authorZh: "薄萍",
        authorEn: "Bo Ping",
        category: "family",
        categoryZh: "家庭与成长",
        categoryEn: "Family & Growth",
        descriptionZh: "围绕家庭沟通、关系经营与共同成长展开的主题作品。",
        descriptionEn: "A practical title about communication, relationships, and growing together as a family.",
        formatZh: "纸书 / 电子书",
        formatEn: "Print / eBook",
        cover: "linear-gradient(145deg,#8b6945,#d4b26b)",
        groups: ["coming", "life", "ebook"]
      },
      {
        titleZh: "这张卡陪我度过了三次离婚",
        titleEn: "This Card Saw Me Through Three Divorces",
        authorZh: "Lisa",
        authorEn: "Lisa",
        category: "relationships",
        categoryZh: "关系与情感",
        categoryEn: "Relationships & Emotions",
        descriptionZh: "以婚姻与人生经历为线索的情感故事。",
        descriptionEn: "An emotional story shaped by marriage and life experience.",
        formatZh: "电子书",
        formatEn: "eBook",
        cover: "linear-gradient(145deg,#6a3e67,#c081a7)",
        groups: ["coming", "life", "fiction"]
      },
      {
        titleZh: "最后一个扫墓人",
        titleEn: "The Last Grave Keeper",
        authorZh: "关天宇",
        authorEn: "Guan Tianyu",
        category: "fiction",
        categoryZh: "小说",
        categoryEn: "Fiction",
        descriptionZh: "围绕一位扫墓人的人生经历与时代记忆展开的小说。",
        descriptionEn: "A novel following a grave keeper’s life and the memories of an era.",
        formatZh: "纸书",
        formatEn: "Print",
        cover: "linear-gradient(145deg,#4a3333,#9b7764)",
        groups: ["coming", "fiction"]
      },
      {
        titleZh: "亲子阅读小课堂",
        titleEn: "A Family Reading Workshop",
        authorZh: "书局精选",
        authorEn: "Publisher’s Selection",
        category: "children",
        categoryZh: "儿童与科普",
        categoryEn: "Children & Popular Science",
        descriptionZh: "亲子共读主题示例条目，可替换为正式出版书籍资料。",
        descriptionEn: "A sample family reading title. Replace with an actual publication before launch.",
        formatZh: "电子书",
        formatEn: "eBook",
        cover: "linear-gradient(145deg,#9b3e43,#efb64d)",
        groups: ["kids", "ebook"]
      }
    ];

    const sections = [
      { key: "new", zh: "新发布", en: "New Releases", subZh: "最近加入书局目录的作品", subEn: "Recently added to our catalog" },
      { key: "coming", zh: "即将推出", en: "Coming Soon", subZh: "抢先了解即将与读者见面的作品", subEn: "Get a first look at upcoming titles", tint: true },
      { key: "featured", zh: "精选作品", en: "Featured Titles", subZh: "从书局目录中为你挑选", subEn: "Selected from our publishing catalog" },
      { key: "ebook", zh: "电子书精选", en: "Featured eBooks", subZh: "方便随身阅读的数字版本", subEn: "Digital editions for reading anywhere", tint: true },
      { key: "fiction", zh: "精选小说", en: "Featured Fiction", subZh: "走进不同的人生与故事", subEn: "Discover lives and stories" },
      { key: "life", zh: "生活与成长", en: "Life & Growth", subZh: "家庭、关系与个人成长主题", subEn: "Family, relationships, and personal growth", tint: true },
      { key: "kids", zh: "儿童与科普", en: "Children & Popular Science", subZh: "适合亲子共读，也适合探索新知识", subEn: "For family reading and curious minds" }
    ];

    const categories = [
      { key: "all", zh: "全部图书", en: "All Books" },
      { key: "fiction", zh: "小说", en: "Fiction" },
      { key: "martial-arts", zh: "武术与传统文化", en: "Martial Arts & Tradition" },
      { key: "travel", zh: "文化与旅行", en: "Culture & Travel" },
      { key: "history", zh: "艺术与历史", en: "Art & History" },
      { key: "family", zh: "家庭与成长", en: "Family & Growth" },
      { key: "relationships", zh: "关系与情感", en: "Relationships & Emotions" },
      { key: "children", zh: "儿童与科普", en: "Children & Popular Science" }
    ];

    const shelves = document.getElementById("shelves");
    const categoryDropdown = document.getElementById("categoryDropdown");
    const categoryPills = document.getElementById("categoryPills");
    const modal = document.getElementById("bookModal");

    function text(zh, en) {
      return language === "zh" ? zh : en;
    }

    function renderShelves() {
      shelves.innerHTML = sections.map(section => {
        const sectionTitle = text(section.zh, section.en);
        const subtitle = text(section.subZh, section.subEn);
        const items = books.filter(book => book.groups.includes(section.key));

        return `
          <section class="book-section ${section.tint ? "tint" : ""}" id="${section.key === "new" ? "new-books" : ""}">
            <div class="wrap">
              <div class="section-heading">
                <div>
                  <h2>${sectionTitle}</h2>
                  <p>${subtitle}</p>
                </div>
                <a class="see-all" href="#catalog"
                   data-see-all="${section.key}">${text("查看全部", "See all")}</a>
              </div>
              <div class="shelf">
                ${items.map(bookCard).join("")}
              </div>
            </div>
          </section>
        `;
      }).join("");
    }

    function bookCard(book) {
      const title = language === "zh" ? book.titleZh : book.titleEn;
      const author = language === "zh" ? book.authorZh : book.authorEn;
      const category = language === "zh" ? book.categoryZh : book.categoryEn;
      const format = language === "zh" ? book.formatZh : book.formatEn;
      const index = books.indexOf(book);

      return `
        <article class="book-card" tabindex="0" role="button" data-book="${index}">
          <div class="book-cover" style="--cover:${book.cover}">
            <div class="cover-copy">
              <div class="cover-category">${category}</div>
              <div class="cover-title">${title}</div>
              <div class="cover-author">${author}</div>
            </div>
          </div>
          <h3>${title}</h3>
          <div class="book-author">${author}</div>
          <div class="book-format">${format}</div>
        </article>
      `;
    }

    function renderCategories() {
      categoryDropdown.innerHTML = categories.map(category => `
        <button type="button" data-category="${category.key}">
          ${text(category.zh, category.en)}
        </button>
      `).join("");

      categoryPills.innerHTML = categories.map(category => `
        <button type="button" data-category="${category.key}">
          ${text(category.zh, category.en)}
        </button>
      `).join("");
    }

    function setLanguage(nextLanguage) {
      language = nextLanguage;
      document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

      document.querySelectorAll("[data-zh][data-en]").forEach(element => {
        element.textContent = text(element.dataset.zh, element.dataset.en);
      });

      document.getElementById("languageButton").textContent =
        language === "zh" ? "English" : "中文";

      document.getElementById("searchInput").placeholder =
        text("搜索你想找的书……", "Search for a book…");

      document.getElementById("searchInput").setAttribute(
        "aria-label",
        text("搜索图书", "Search books")
      );

      document.getElementById("brandName").innerHTML =
        language === "zh"
          ? '北美中国书局出版社<small>NORTH AMERICA CHINA BOOK BUREAU PRESS</small>'
          : 'North America China Book Bureau Press<small>北美中国书局出版社</small>';

      renderShelves();
      renderCategories();
    }

    function showResults(title, resultBooks) {
      const resultArea = document.getElementById("searchResults");
      const label = language === "zh" ? "本书" : "books";
      const noResults = text("没有找到相关图书。", "No books found.");
      const cards = resultBooks.map(bookCard).join("");

      resultArea.innerHTML = `
        <section class="book-section">
          <div class="section-heading">
            <h2>${title}</h2>
            <span class="see-all">${resultBooks.length} ${label}</span>
          </div>
          <div class="shelf">
            ${cards || `<p>${noResults}</p>`}
          </div>
        </section>
      `;
      resultArea.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function openBook(index) {
      const book = books[index];
      if (!book) return;

      document.getElementById("modalTitle").textContent =
        language === "zh" ? book.titleZh : book.titleEn;

      document.getElementById("modalAuthor").textContent =
        `${language === "zh" ? book.authorZh : book.authorEn} · ` +
        `${language === "zh" ? book.categoryZh : book.categoryEn} · ` +
        `${language === "zh" ? book.formatZh : book.formatEn}`;

      document.getElementById("modalDescription").textContent =
        language === "zh" ? book.descriptionZh : book.descriptionEn;

      const purchaseLink = document.getElementById("purchaseLink");
      purchaseLink.href = book.buyUrl || "#";
      purchaseLink.onclick = event => {
        if (!book.buyUrl) {
          event.preventDefault();
          showToast(text(
            "请在书籍资料中添加 KDP 或 Ingram 购书链接。",
            "Add a KDP or Ingram purchase link to this book."
          ));
        }
      };

      modal.classList.add("show");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(window.toastTimer);
      window.toastTimer = window.setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    document.getElementById("languageButton").addEventListener("click", () => {
      setLanguage(language === "zh" ? "en" : "zh");
    });

    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      const query = document.getElementById("searchInput").value.trim().toLowerCase();

      if (!query) {
        document.getElementById("searchResults").innerHTML = "";
        return;
      }

      const matches = books.filter(book => {
        const searchable = [
          book.titleZh, book.titleEn,
          book.authorZh, book.authorEn,
          book.categoryZh, book.categoryEn,
          book.descriptionZh, book.descriptionEn
        ].join(" ").toLowerCase();

        return searchable.includes(query);
      });

      showResults(text(`搜索结果：${query}`, `Search results: ${query}`), matches);
    });

    document.addEventListener("click", event => {
      const card = event.target.closest(".book-card");
      if (card) openBook(Number(card.dataset.book));

      const categoryButton = event.target.closest("[data-category]");
      if (categoryButton) {
        const categoryKey = categoryButton.dataset.category;
        const category = categories.find(item => item.key === categoryKey);
        const matches = categoryKey === "all"
          ? books
          : books.filter(book => book.category === categoryKey);

        showResults(text(category.zh, category.en), matches);
        document.getElementById("browseItem").classList.remove("open");
      }

      const seeAll = event.target.closest("[data-see-all]");
      if (seeAll) {
        const group = seeAll.dataset.seeAll;
        const matches = books.filter(book => book.groups.includes(group));
        const section = sections.find(item => item.key === group);
        showResults(text(section.zh, section.en), matches);
      }

      if (event.target.id === "closeModal" || event.target === modal) {
        modal.classList.remove("show");
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") modal.classList.remove("show");

      if (event.key === "Enter" && event.target.matches(".book-card")) {
        openBook(Number(event.target.dataset.book));
      }
    });

    document.querySelectorAll(".header-actions button").forEach(button => {
      button.addEventListener("click", () => {
        showToast(language === "zh"
          ? button.dataset.toastZh
          : button.dataset.toastEn
        );
      });
    });

    const navigation = document.getElementById("navigation");
    const mobileMenu = document.getElementById("mobileMenu");

    mobileMenu.addEventListener("click", () => {
      const isOpen = navigation.classList.toggle("mobile-open");
      mobileMenu.setAttribute("aria-expanded", String(isOpen));
    });

    document.getElementById("browseToggle").addEventListener("click", event => {
      if (window.matchMedia("(max-width: 650px)").matches) {
        event.preventDefault();
        document.getElementById("browseItem").classList.toggle("open");
      }
    });

    const slides = [...document.querySelectorAll(".slide")];
    const dots = document.getElementById("slideDots");
    let currentSlide = 0;

    dots.innerHTML = slides.map((_, index) =>
      `<button type="button" aria-label="Slide ${index + 1}"></button>`
    ).join("");

    const dotButtons = [...dots.querySelectorAll("button")];

    function showSlide(index) {
      currentSlide = (index + slides.length) % slides.length;
      slides.forEach((slide, i) => slide.classList.toggle("active", i === currentSlide));
      dotButtons.forEach((dot, i) => dot.classList.toggle("active", i === currentSlide));
    }

    document.getElementById("previousSlide").addEventListener("click", () => {
      showSlide(currentSlide - 1);
    });

    document.getElementById("nextSlide").addEventListener("click", () => {
      showSlide(currentSlide + 1);
    });

    dotButtons.forEach((dot, index) => {
      dot.addEventListener("click", () => showSlide(index));
    });

    window.setInterval(() => showSlide(currentSlide + 1), 5500);

    setLanguage("zh");
  </script>
</body>
</html>
